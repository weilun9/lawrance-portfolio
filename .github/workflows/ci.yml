name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Runs the gitleaks CLI directly: gitleaks-action scans "first^..last",
      # which fails on a repo whose first push includes the root commit.
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh zricethezav/gitleaks:latest -c \
            "git config --global --add safe.directory /repo && gitleaks git . --redact --verbose --exit-code 1"
